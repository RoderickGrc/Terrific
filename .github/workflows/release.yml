name: release

on:
  push:
    tags:
      - "v*"

# Trusted publishing: npm verifies this workflow via OIDC. No NPM_TOKEN.
# Node 26 ships npm >= 11.5.1, the floor for trusted publishing, so `npm install -g npm@latest` is not needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
